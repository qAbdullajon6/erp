name: CI

# Runs on every PR into main and on push to main (post-merge confirmation).
# All jobs below are blocking after Sprint B Engineering Cleanup (API lint +
# full typecheck + unit tests no longer use continue-on-error). See CI_CD_GUIDE.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web · typecheck · lint · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck:web
      - name: Lint
        run: npm run lint:web
      - name: Unit tests (vitest)
        run: npm run test --workspace=apps/web
      - name: Production build (vite)
        run: npm run build:web

  api-build:
    name: API · build (compiles src via tsconfig.build.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Nest build (this is the src typecheck gate)
        run: npm run build:api

  migrations:
    name: Migrations · apply to ephemeral Postgres + status
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_ci?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Apply migrations (the exact command the API runs on boot)
        working-directory: apps/api
        run: npx prisma migrate deploy
      - name: Assert schema is in sync (no drift, no pending)
        working-directory: apps/api
        run: npx prisma migrate status

  docker-build:
    name: Docker · build API + WEB images (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: flowerp-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build WEB image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: flowerp-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Public Mapbox token is optional in CI; empty keeps the image buildable.
          build-args: |
            VITE_MAPBOX_ACCESS_TOKEN=

  api-quality:
    # Blocking gate after Sprint B Engineering Cleanup — typecheck + eslint
    # across apps/api/src (and test/ via typecheck:api) must stay green.
    name: API · lint + full typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
      - name: ESLint src
        working-directory: apps/api
        run: npx eslint "src/**/*.ts"
      - name: Full typecheck incl. test/
        run: npm run typecheck:api

  api-tests:
    name: API · unit tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_test?schema=public
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prisma generate
        run: npm run prisma:generate
      - name: Jest (unit)
        run: npm run test:api

  # ── Sprint A — Enterprise regression gate (blocking) ─────────────────
  playwright-regression:
    name: Playwright · enterprise regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp:erp@localhost:5432/erp_e2e?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-playwright-jwt-secret-not-for-production-use-48chars
      APP_SECRET: ci-playwright-app-secret-32bytes-min!!
      APP_PUBLIC_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      API_URL: http://localhost:4000
      SKIP_GLOBAL_SETUP: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Prisma generate + migrate
        run: |
          npm run prisma:generate
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Build API
        run: npm run build:api
      - name: Seed test organization
        working-directory: apps/api
        run: npx ts-node prisma/seed-test-org.ts
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Start API
        working-directory: apps/api
        run: |
          node dist/main > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "API failed to start"; tail -100 /tmp/api.log; exit 1
      - name: Playwright regression
        working-directory: apps/web
        run: npm run test:e2e:regression
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
